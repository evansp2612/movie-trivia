<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Movie Trivia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="module" src="js/landing.js"></script>
</head>

<body class="landing">
  <!-- Landing view (the only player-facing URL) -->
  <main class="landing__card" id="landing-view">
    <h1 class="landing__title">Movie Trivia</h1>
    <p class="landing__tagline">Test your knowledge</p>

    <button id="play-daily" class="btn btn--primary" disabled>
      <span class="btn__label" hidden>Game of the Day</span>
      <span class="spinner" aria-hidden="true"></span>
      <span class="btn__check" hidden aria-hidden="true">&#10003;</span>
    </button>

    <button id="play-freeplay" class="btn btn--outline">
      Free Play
    </button>

    <p id="daily-meta" class="landing__meta" aria-live="polite"></p>
  </main>

  <!-- Game view -->
  <main class="game__wrap" id="game-view" hidden>
    <header class="game__hud">
      <span id="hud-round">Round — of 10</span>
      <span class="hud-right">
        <span id="hud-score">Score 0</span>
        <button id="hud-close" class="close-btn" title="Close and return to menu"
          aria-label="Close and return to menu">&#10005;</button>
      </span>
    </header>
    <section id="round-root" class="game__stage">
      <p class="landing__meta">Loading round…</p>
    </section>
  </main>

  <!-- End view -->
  <main class="landing__card" id="end-view" hidden>
    <button class="card-close" title="Close and return to menu" aria-label="Close and return to menu">&#10005;</button>
    <p class="score-label" id="score-label">Your Score</p>
    <h1 class="landing__title" id="final-score">…</h1>
    <p class="landing__tagline" id="end-detail"></p>
  </main>
</body>

</html>
